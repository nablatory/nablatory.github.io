name: Deploy to GitHub Pages

# Runs only when started by hand from the Actions tab, so that publishing is
# always an explicit decision by a maintainer.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Fails early, with a clear message, if Settings → Pages → Source is not
      # "GitHub Actions". Its base_path is "" for <owner>.github.io or a custom
      # domain and "/<repo>" for a project site.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The repository variable NABLATORY_BASE, when set, overrides the path
          # that GitHub Pages reports.
          NABLATORY_BASE: ${{ vars.NABLATORY_BASE || format('{0}/', steps.pages.outputs.base_path) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
